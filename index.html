<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Worker LB · 控制台</title>
    <script src="/theme.js"></script>
    <style>
      html { min-width: 320px; min-height: 100%; background: #fff; color: #161719; }
      html[data-theme="dark"] { background: #101113; color: #f7f7f8; }
      body { min-width: 320px; min-height: 100vh; margin: 0; background: inherit; }
      .boot-screen { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; background: inherit; color: inherit; font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .boot-mark { display: grid; width: 42px; height: 42px; place-items: center; border-radius: 13px; background: linear-gradient(180deg, #4d98ff, #1f6cf0); color: #fff; font-size: 18px; font-weight: 700; box-shadow: 0 0 0 1px #246ad2, inset 0 1px rgba(255,255,255,.3), 0 3px 10px rgba(24,102,230,.18); }
      .boot-spinner { width: 18px; height: 18px; border: 2px solid rgba(128,128,128,.22); border-top-color: #2878ff; border-radius: 50%; animation: boot-spin .7s linear infinite; }
      .boot-screen strong { font-size: 13px; font-weight: 600; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-spinner { animation: none; border-color: #2878ff; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-screen" role="status"><span class="boot-mark">W</span><span class="boot-spinner" aria-hidden="true"></span><strong>正在连接 Worker LB</strong></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
