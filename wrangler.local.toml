name = "worker-lb-local"
main = "workers/unified/index.ts"
compatibility_date = "2026-09-15"

[triggers]
crons = ["* * * * *"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "worker-lb-local"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "CONFIG_KV"
id = "00000000000000000000000000000001"

[vars]
ENVIRONMENT = "development"
WORKER_NAME = "worker-lb-local"
AFFINITY_SECRET = "local-development-affinity-secret-change-me"
TOKEN_ENCRYPTION_KEY = "local-development-token-encryption-key-change-me"
CONFIG_CACHE_SECONDS = "1"
REQUEST_LOG_SAMPLE_RATE = "1"
